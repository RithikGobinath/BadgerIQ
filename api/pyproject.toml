[project]
name = "badgeriq-api"
version = "0.1.0"
description = "BadgerIQ API - serves precomputed UW-Madison course difficulty data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "google-cloud-storage>=2.16",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.2",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "snapshot*", "ingest*"]
